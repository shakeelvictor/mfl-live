<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MFL Live</title>
<!-- Remembered theme, stamped before the stylesheet so there is no flash.
     No stored choice means dark: dark is the default. -->
<script>try{if(localStorage.getItem("mfl-live-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,700;1,900&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="app" id="app">
  <div class="wash"></div>

  <div class="shell layout">
  <div class="col-board">

    <header class="masthead">
      <div class="brandwrap">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="10.2" ry="6.1" transform="rotate(-45 12 12)"/><path d="M8.8 15.2l6.4-6.4M9.85 12.85l1.3 1.3M11.35 11.35l1.3 1.3M12.85 9.85l1.3 1.3"/></svg></span>
        <span class="brand">MFL <span class="brand-live" id="brand-live">Live<span class="dot" aria-hidden="true"></span></span></span>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button class="seg-btn" type="button" data-theme="dark" aria-pressed="true">Dark</button>
        <button class="seg-btn" type="button" data-theme="light" aria-pressed="false">Light</button>
      </div>
    </header>

    <div class="week">
      <div class="week-row">
        <h1 id="week-title">Week</h1>
        <span class="kick" id="kick" hidden><span class="dot" aria-hidden="true"></span>Kicks off in <b id="countdown"></b></span>
      </div>
      <p class="subhead" id="subhead">All-play &middot; every team plays every other team</p>
    </div>

    <div class="capsules" id="capsules"></div>

    <div class="hero-wrap" id="hero-wrap">
    <button class="hero" id="hero" type="button">
      <span class="hero-body" id="hero-body"></span>
      <span class="hero-wave" aria-hidden="true"></span>
      <span class="fx" aria-hidden="true">
        <span class="strobe"></span>
        <span class="sweep"></span>
        <svg class="bolts" viewBox="0 0 100 60" preserveAspectRatio="none">
          <polyline class="bolt" pathLength="1" points="10,-2 27,22 19,25 38,62"/>
          <polyline class="bolt" pathLength="1" points="64,-2 55,17 62,19 48,52"/>
          <polyline class="bolt" pathLength="1" points="90,2 83,25 89,27 79,62"/>
        </svg>
      </span>
    </button>
    <span class="hero-money" aria-hidden="true">💰</span>
    </div>

    <section class="spot" id="spot" aria-label="Spotlight"></section>

    <section class="standings" aria-label="Standings">
      <div class="standings-head">
        <h2>Standings</h2>
        <span id="franchise-count"></span>
      </div>
      <div class="board" id="rows"></div>
    </section>

  </div><!-- /col-board -->

<div class="team-page" id="team" data-open="false" role="dialog" aria-modal="true" aria-labelledby="team-name">
  <div class="wash"></div>
  <div class="shell">

    <header class="team-head">
      <button class="glass back" id="back" type="button"><span class="chev-l" aria-hidden="true">&lsaquo;</span>Standings</button>
    </header>

    <section class="hero">
      <div class="hero-top">
        <span class="micro hero-label"><span class="badge" id="team-rank"></span><span id="team-week"></span></span>
        <span class="hero-status" id="team-status"></span>
      </div>
      <div class="hero-mid">
        <div class="hero-id">
          <h2 class="hero-name" id="team-name"></h2>
          <span class="hero-rec" id="team-rec"></span>
        </div>
        <span class="hero-pts" id="team-pts"></span>
      </div>
    </section>

    <div class="tabs" role="tablist" aria-label="Lineup">
      <button class="tab" type="button" role="tab" data-tab="starters" aria-selected="true">Starters <span id="tab-starters-n"></span></button>
      <button class="tab" type="button" role="tab" data-tab="bench" aria-selected="false">Bench <span id="tab-bench-n"></span></button>
    </div>

    <section class="roster" id="roster"></section>

  </div>
</div>

  </div><!-- /layout -->
</div><!-- /app -->

<!-- Touchdown announcement: one at a time, 4s each, queued. -->
<div class="td" id="td-modal" data-open="false" role="status" aria-live="polite">
  <div class="td-scrim" id="td-scrim"></div>
  <div class="td-card" id="td-card"></div>
</div>

<!-- Loading interstitial: shown by default so nothing paints before it. -->
<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="wash"></div>
  <div class="loader-inner">
    <div class="loader-ball" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="12" rx="10.2" ry="6.1" transform="rotate(-45 12 12)"/>
        <path d="M8.8 15.2l6.4-6.4M9.85 12.85l1.3 1.3M11.35 11.35l1.3 1.3M12.85 9.85l1.3 1.3"/>
      </svg>
    </div>
    <div class="loader-brand">MFL <span>Live</span></div>
    <div class="loader-field" aria-hidden="true"><span class="loader-marker"></span></div>
    <div class="loader-msg" id="loader-msg">Pulling the live feed&hellip;</div>
  </div>
</div>

<!-- data.js (the embedded fixture) is loaded by app.js only as a fallback. -->
<script src="app.js"></script>
